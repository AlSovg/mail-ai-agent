services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mailagent
      POSTGRES_PASSWORD: mailagent
      POSTGRES_DB: mailagent
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # Публичный HTTPS для e2e: docker compose --profile tunnel up ngrok
  # Приложение на хосте: uvicorn mailagent.api:app --port 8000
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [tunnel]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http --url=${NGROK_DOMAIN} host.docker.internal:8000
    ports: ["4040:4040"]  # инспектор запросов
volumes:
  pgdata:
